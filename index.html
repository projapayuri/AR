<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
   
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
</head>
<body>
    <a-scene 
        physics="gravity: -9.8"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable">

        <a-sky color="steelblue"></a-sky>

       
        <a-plane
            rotation="-90 0 0"
            width="15"
            height="15"
            static-body
            color="darkseagreen">
        </a-plane>

       
        <a-sphere
            id="ball"
            class="clickable"
            position="-3 1 -4"
            color="skyblue"
            radius="0.7"
            dynamic-body>
        </a-sphere>

        
        <a-box id="firstBox" position="-1.5 1 -4" width="0.2" height="2" depth="2" color="white" dynamic-body></a-box>
        
        <a-box position="-0.7 1 -4" width="0.2" height="2" depth="2" color="white" dynamic-body></a-box>
        <a-box position="0.1 1 -4"  width="0.2" height="2" depth="2" color="white" dynamic-body></a-box>
        <a-box position="0.9 1 -4"  width="0.2" height="2" depth="2" color="white" dynamic-body></a-box>
        <a-box position="1.7 1 -4"  width="0.2" height="2" depth="2" color="white" dynamic-body></a-box>

      
        <a-entity position="5 1 5" rotation="0 45 0">
            <a-camera id="camera"></a-camera>
        </a-entity>

        <script>
            const ball = document.getElementById("ball");
            const camera = document.getElementById("camera");

            function shootBall() {
                const direction = new THREE.Vector3();

                // Get camera direction
                camera.object3D.getWorldDirection(direction);

                const power = -500;

                ball.body.applyImpulse(
                    new CANNON.Vec3(
                        direction.x * power,
                        direction.y * power,
                        direction.z * power
                    ),
                    ball.body.position
                );
            }

            ball.addEventListener("click", shootBall);
        </script>
    </a-scene>
</body>
</html>
